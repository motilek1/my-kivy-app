name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev ccache openjdk-17-jdk zip unzip lld libtool autoconf automake pkg-config gettext
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Fix buildozer.spec
      run: |
        sed -i 's/kivymd==1.2.0/kivymd/g' buildozer.spec
        sed -i 's/kivy==2.3.0/kivy/g' buildozer.spec
        sed -i 's/android.api = .*/android.api = 33/g' buildozer.spec
        sed -i 's/android.minapi = .*/android.minapi = 21/g' buildozer.spec
        sed -i 's/android.ndk = .*/android.ndk = 25b/g' buildozer.spec
        sed -i '/android.build_tools_version/d' buildozer.spec
        echo -e "\nandroid.build_tools_version = 33.0.2" >> buildozer.spec
        sed -i "s|# android.sdk_path = .*|android.sdk_path = $ANDROID_HOME|g" buildozer.spec

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
