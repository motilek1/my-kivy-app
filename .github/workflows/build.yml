name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Fix buildozer.spec
      run: |
        sed -i 's/kivymd==1.2.0/kivymd/g' buildozer.spec
        sed -i 's/kivy==2.3.0/kivy/g' buildozer.spec
        sed -i 's/android.api = .*/android.api = 33/g' buildozer.spec
        sed -i 's/android.minapi = .*/android.minapi = 21/g' buildozer.spec
        sed -i 's/android.ndk = .*/android.ndk = 25b/g' buildozer.spec
        sed -i '/android.build_tools_version/d' buildozer.spec
        echo -e "\nandroid.build_tools_version = 33.0.2" >> buildozer.spec

    - name: Build with Buildozer Docker
      uses: addunc/buildozer-action@v2
      with:
        command: buildozer -v android debug
        buildozer_version: master

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
