name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev ccache openjdk-17-jdk zip unzip lld libtool autoconf automake pkg-config gettext wget
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Install Android Command Line Tools & Accept Licenses
      run: |
        # Створюємо потрібну папку для SDK
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools
        
        # Завантажуємо та розпаковуємо SDK tools у точне місце, яке чекає Buildozer
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9441835_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mv cmdline-tools/* ~/.buildozer/android/platform/android-sdk/tools/
        rm -rf cmdline-tools cmdline-tools.zip

        # Приймаємо всі ліцензії через розпакований sdkmanager
        yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --sdk_root=/home/runner/.buildozer/android/platform/android-sdk --licenses || true

    - name: Fix buildozer.spec
      run: |
        sed -i 's/kivymd==1.2.0/kivymd/g' buildozer.spec
        sed -i 's/kivy==2.3.0/kivy/g' buildozer.spec
        sed -i 's/android.api = .*/android.api = 33/g' buildozer.spec
        sed -i 's/android.minapi = .*/android.minapi = 21/g' buildozer.spec
        sed -i 's/android.ndk = .*/android.ndk = 25b/g' buildozer.spec
        
        sed -i '/android.build_tools_version/d' buildozer.spec
        echo -e "\nandroid.build_tools_version = 33.0.2" >> buildozer.spec

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
